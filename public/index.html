<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💪 FitТРЕК</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap');

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --card: #1e1e24;
    --border: #2a2a35;
    --accent: #f97316;
    --green: #22c55e;
    --blue: #3b82f6;
    --purple: #a855f7;
    --text: #f1f1f3;
    --muted: #6b6b7b;
    --danger: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky; top: 0; z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', cursive;
    font-size: 24px; color: var(--accent); letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .logo span { color: var(--text); }

  /* TOP TABS (Кардіо / Силові) */
  .top-tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .top-tab {
    padding: 10px; border: none; border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--border);
  }
  .top-tab.active-cardio { background: var(--accent); color: #fff; border-color: var(--accent); }
  .top-tab.active-strength { background: var(--purple); color: #fff; border-color: var(--purple); }

  /* SUB NAV */
  .sub-nav {
    display: flex; gap: 4px;
    background: var(--card); border-radius: 10px;
    padding: 4px; margin: 16px 16px 0;
  }
  .sub-tab {
    flex: 1; padding: 7px; border: none; background: transparent;
    color: var(--muted); font-family: 'Inter', sans-serif;
    font-size: 12px; font-weight: 500; border-radius: 7px; cursor: pointer; transition: all 0.2s;
    text-align: center;
  }
  .sub-tab.active { background: var(--bg); color: var(--text); }

  /* PAGES */
  .section { display: none; }
  .section.active { display: block; }
  .page { display: none; padding: 16px; max-width: 700px; margin: 0 auto; }
  .page.active { display: block; }

  /* CARDS */
  .form-card {
    background: var(--card); border-radius: 16px;
    padding: 18px; border: 1px solid var(--border); margin-bottom: 14px;
  }
  .form-card h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

  .date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .date-row label { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .date-row input[type="date"] {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif;
    font-size: 14px; padding: 7px 10px; flex: 1; outline: none;
  }

  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

  .metric-input {
    background: var(--bg); border-radius: 12px; padding: 12px;
    display: flex; flex-direction: column; gap: 4px;
    border: 1px solid transparent; transition: border-color 0.2s;
  }
  .metric-input:focus-within { border-color: var(--accent); }
  .metric-input label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .metric-input input {
    background: transparent; border: none; color: var(--text);
    font-family: 'Bebas Neue', cursive; font-size: 30px; width: 100%; outline: none;
  }
  .metric-input input::placeholder { color: var(--border); }
  .metric-input .unit { font-family: 'Bebas Neue', cursive; font-size: 13px; color: var(--accent); }

  /* BUTTONS */
  .btn {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 13px 20px; border-radius: 12px; border: none;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; width: 100%;
  }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { background: #16a34a; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-purple:hover { background: #9333ea; }
  .btn-ghost { background: var(--border); color: var(--text); margin-top: 8px; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
  .stat-card { background: var(--card); border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid var(--border); }
  .stat-card .num { font-family: 'Bebas Neue', cursive; font-size: 28px; color: var(--accent); line-height: 1; }
  .stat-card .num.purple { color: var(--purple); }
  .stat-card .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  .period-selector { display: flex; gap: 4px; background: var(--card); border-radius: 10px; padding: 4px; margin-bottom: 14px; width: fit-content; }
  .period-btn { padding: 6px 14px; border: none; background: transparent; color: var(--muted); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; border-radius: 7px; cursor: pointer; transition: all 0.2s; }
  .period-btn.active { background: var(--accent); color: #fff; }
  .period-btn.active-p { background: var(--purple); color: #fff; }

  /* CHART */
  .chart-wrap { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); }
  .chart-title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .chart-bars { display: flex; align-items: flex-end; gap: 5px; height: 70px; }
  .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .chart-bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 3px; opacity: 0.85; }
  .chart-bar.purple { background: var(--purple); }
  .chart-bar-label { font-size: 9px; color: var(--muted); text-transform: uppercase; }

  /* SESSION LIST */
  .sessions-list { display: flex; flex-direction: column; gap: 8px; }
  .session-item { background: var(--card); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); }
  .session-date { min-width: 44px; text-align: center; }
  .session-date .day { font-family: 'Bebas Neue', cursive; font-size: 24px; color: var(--accent); line-height: 1; }
  .session-date .day.purple { color: var(--purple); }
  .session-date .month { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .session-divider { width: 1px; height: 34px; background: var(--border); }
  .session-metrics { flex: 1; display: flex; gap: 14px; flex-wrap: wrap; }
  .session-metric .val { font-family: 'Bebas Neue', cursive; font-size: 18px; color: var(--text); line-height: 1; }
  .session-metric .key { font-size: 9px; color: var(--muted); text-transform: uppercase; }
  .session-delete { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 4px; border-radius: 6px; transition: all 0.2s; }
  .session-delete:hover { color: var(--danger); background: rgba(239,68,68,0.1); }

  /* STRENGTH WORKOUT */
  .workout-card { background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid var(--border); margin-bottom: 12px; }
  .workout-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .workout-title { font-family: 'Bebas Neue', cursive; font-size: 22px; letter-spacing: 1px; color: var(--purple); }
  .workout-date { font-size: 11px; color: var(--muted); }

  .exercise-block { margin-bottom: 12px; }
  .exercise-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .sets-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .set-badge {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px;
    font-family: 'Bebas Neue', cursive; font-size: 14px;
    color: var(--text); letter-spacing: 0.5px;
  }
  .set-badge.pr { border-color: var(--purple); color: var(--purple); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .upload-zone {
    border: 2px dashed var(--border); border-radius: 16px;
    padding: 30px 20px; text-align: center; cursor: pointer;
    background: var(--card); margin: 16px 16px 12px; transition: all 0.3s;
  }
  .upload-zone:hover { border-color: var(--accent); background: rgba(249,115,22,0.05); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(168,85,247,0.4); } 50% { box-shadow: 0 0 0 16px rgba(168,85,247,0); } }

  /* ADD EXERCISE FORM */
  .exercise-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .ex-input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; outline: none; width: 100%; }
  .ex-input:focus { border-color: var(--purple); }

  .add-set-btn { width: 100%; padding: 10px; margin-bottom: 6px; background: transparent; color: var(--purple); border: 1px dashed var(--purple); border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
  .hold-hint { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 4px; }
  #setsContainer .exercise-form, .exercise-block { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #setsContainer .exercise-form.holding .ex-input { background: rgba(239,68,68,0.3); border-color: var(--danger); transition: background 0.6s linear, border-color 0.6s linear; }
  .exercise-block { border-radius: 8px; }
  .exercise-block.holding { background: rgba(239,68,68,0.22); transition: background 0.6s linear; }
  .workout-timer { text-align: center; margin: 4px 0 6px; }
  .timer-value { font-family: 'Bebas Neue', sans-serif; font-size: 56px; letter-spacing: 2px; color: var(--purple); line-height: 1; }
  .timer-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .timer-cancel { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 12px; cursor: pointer; padding: 0; font-family: inherit; }

  /* CALENDAR */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav h2 { font-family: 'Bebas Neue', cursive; font-size: 22px; letter-spacing: 1px; }
  .cal-nav button { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .cal-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-bottom: 16px; }
  .cal-header { text-align: center; font-size: 9px; color: var(--muted); text-transform: uppercase; padding: 5px 0; }
  .cal-day { aspect-ratio: 1; border-radius: 7px; background: var(--card); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; transition: all 0.2s; }
  .cal-day.empty { background: transparent; border-color: transparent; }
  .cal-day.has-cardio { border-color: var(--accent); background: rgba(249,115,22,0.12); cursor: pointer; }
  .cal-day.has-strength { border-color: var(--purple); background: rgba(168,85,247,0.12); cursor: pointer; }
  .cal-day.has-both { border-color: var(--green); background: rgba(34,197,94,0.12); cursor: pointer; }
  .cal-day.today { box-shadow: 0 0 0 2px var(--blue); }
  .cal-day .cal-num { font-weight: 600; line-height: 1; }
  .cal-day .cal-km { font-size: 9px; color: var(--accent); margin-top: 2px; font-weight: 700; }
  .cal-day .cal-dots { display: flex; gap: 2px; margin-top: 3px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .cal-dot.c { background: var(--accent); }
  .cal-dot.s { background: var(--purple); }

  .day-detail { background: var(--card); border-radius: 14px; padding: 16px; border: 1px solid var(--border); display: none; }
  .day-detail h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--green); color: #fff; padding: 11px 22px; border-radius: 100px; font-weight: 600; font-size: 13px; transition: transform 0.3s; z-index: 1000; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">💪 <span>FIT</span>ТРЕК</div>
  <div class="top-tabs">
    <button class="top-tab active-cardio" onclick="switchSection('cardio')">🚴 Кардіо</button>
    <button class="top-tab" onclick="switchSection('strength')">🏋️ Силові</button>
  </div>
</div>

<!-- ===== CARDIO SECTION ===== -->
<div class="section active" id="section-cardio">
  <div class="sub-nav">
    <button class="sub-tab active" onclick="switchPage('cardio','add')">+ Додати</button>
    <button class="sub-tab" onclick="switchPage('cardio','history')">Історія</button>
    <button class="sub-tab" onclick="switchPage('cardio','calendar')">Календар</button>
  </div>

  <!-- Cardio Add -->
  <div class="page active" id="cardio-add">
    <!-- Upload zone -->
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:36px;margin-bottom:8px">📷</div>
      <div style="font-weight:600;font-size:15px;margin-bottom:4px">Завантаж фото з тренажера</div>
      <div style="color:var(--muted);font-size:13px">AI зчитає показники автоматично</div>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
    </div>

    <div id="previewContainer" style="display:none;margin-bottom:12px">
      <img id="previewImg" style="width:100%;max-height:240px;object-fit:contain;border-radius:12px">
    </div>

    <div id="loadingDiv" style="display:none;text-align:center;padding:20px;color:var(--muted)">
      <div style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px"></div>
      AI читає показники…
    </div>

    <div class="form-card">
      <h3>🚴 Показники тренування</h3>
      <div class="date-row">
        <label>📅 Дата</label>
        <input type="date" id="cDate">
      </div>
      <div class="metrics-grid">
        <div class="metric-input">
          <label>Час</label>
          <input type="number" id="cTime" placeholder="0" step="1" min="0">
          <span class="unit">ХВ</span>
        </div>
        <div class="metric-input">
          <label>Кілометри</label>
          <input type="number" id="cKm" placeholder="0.0" step="0.1" min="0">
          <span class="unit">КМ</span>
        </div>
        <div class="metric-input">
          <label>Калорії</label>
          <input type="number" id="cCal" placeholder="0" step="1" min="0">
          <span class="unit">ККАЛ</span>
        </div>
        <div class="metric-input">
          <label>Швидкість</label>
          <input type="number" id="cSpeed" placeholder="0.0" step="0.1" min="0">
          <span class="unit">КМ/Г</span>
        </div>
        <div class="metric-input">
          <label>Ватти</label>
          <input type="number" id="cWatt" placeholder="0" step="1" min="0">
          <span class="unit">WATT</span>
        </div>
        <div class="metric-input">
          <label>Рівень опору</label>
          <input type="number" id="cLevel" placeholder="0" step="1" min="0" max="20">
          <span class="unit">РІВЕНЬ</span>
        </div>
      </div>
      <button class="btn btn-green" onclick="saveCardio()">✅ Зберегти</button>
    </div>
  </div>

  <!-- Cardio History -->
  <div class="page" id="cardio-history">
    <div class="period-selector">
      <button class="period-btn" onclick="setCPeriod('week',this)">Тиждень</button>
      <button class="period-btn" onclick="setCPeriod('month',this)">Місяць</button>
      <button class="period-btn active" onclick="setCPeriod('all',this)">Всі</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="num" id="cTotalKm">0</div><div class="lbl">Км</div></div>
      <div class="stat-card"><div class="num" id="cTotalMin">0</div><div class="lbl">Хвилин</div></div>
      <div class="stat-card"><div class="num" id="cTotalCal">0</div><div class="lbl">Ккал</div></div>
    </div>
  
    <div class="sessions-list" id="cSessionsList"></div>
  </div>

  <!-- Cardio Calendar -->
  <div class="page" id="cardio-calendar">
    <div class="cal-nav">
      <button onclick="calPrev('c')">◀</button>
      <h2 id="cCalTitle"></h2>
      <button onclick="calNext('c')">▶</button>
    </div>
    <div class="cal-grid" id="cCalGrid"></div>
    <div class="day-detail" id="cDayDetail">
      <h3 id="cDayTitle"></h3>
      <div class="metrics-grid" id="cDayMetrics"></div>
    </div>
  </div>
</div>

<!-- ===== STRENGTH SECTION ===== -->
<div class="section" id="section-strength">
  <div class="sub-nav">
    <button class="sub-tab active" onclick="switchPage('strength','add')">+ Додати</button>
    <button class="sub-tab" onclick="switchPage('strength','history')">Історія</button>
    <button class="sub-tab" onclick="switchPage('strength','calendar')">Календар</button>
  </div>

  <!-- Strength Add -->
  <div class="page active" id="strength-add">
    <div class="form-card">
      <div class="date-row">
        <label>📅 Дата</label>
        <input type="date" id="sDate">
      </div>
      <div class="workout-timer" id="workoutTimer" style="display:none">
        <div class="timer-value" id="timerValue">00:00</div>
        <div class="timer-sub"><span id="timerSince"></span> · <button class="timer-cancel" onclick="cancelWorkout()">Скасувати</button></div>
      </div>
      <button class="btn btn-purple" id="startWorkoutBtn" onclick="startWorkout()">▶ Почати тренування</button>
    </div>

    <div class="form-card">
      <h3>✏️ Вправа</h3>
      <div style="margin-bottom:10px">
        <input class="ex-input" id="exName" placeholder="Назва вправи (напр. Жим лежачи)" style="width:100%;margin-bottom:8px">
        <div id="setsContainer">
          <div class="exercise-form" id="setRow0"><input class="ex-input" placeholder="Повт." type="number" inputmode="numeric" min="1" id="reps0" value=""><input class="ex-input" placeholder="Вага кг" type="number" inputmode="decimal" step="0.5" id="weight0" value=""></div>
        </div>
        <button class="add-set-btn" onclick="addSetRow()">+ Підхід</button>
        <div class="hold-hint">Щоб видалити підхід або вправу — затисни її</div>
      </div>
      <button class="btn btn-purple" onclick="saveExercise()">💪 Додати вправу</button>
    </div>

    <!-- Current workout preview -->
    <div id="currentWorkoutPreview"></div>

    <button class="btn btn-green" onclick="saveWorkout()" id="saveWorkoutBtn" style="margin-top:12px;display:none">🏁 Закінчити тренування</button>
  </div>

  <!-- Strength History -->
  <div class="page" id="strength-history">
    <div class="period-selector">
      <button class="period-btn" onclick="setSPeriod('week',this)">Тиждень</button>
      <button class="period-btn" onclick="setSPeriod('month',this)">Місяць</button>
      <button class="period-btn active-p" onclick="setSPeriod('all',this)">Всі</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="num purple" id="sTotalWorkouts">0</div><div class="lbl">Тренувань</div></div>
      <div class="stat-card"><div class="num purple" id="sTotalSets">0</div><div class="lbl">Підходів</div></div>
      <div class="stat-card"><div class="num purple" id="sTotalTonnage">0</div><div class="lbl">Тонн</div></div>
    </div>
    <div class="sessions-list" id="sSessionsList"></div>
  </div>

  <!-- Strength Calendar -->
  <div class="page" id="strength-calendar">
    <div class="cal-nav">
      <button onclick="calPrev('s')">◀</button>
      <h2 id="sCalTitle"></h2>
      <button onclick="calNext('s')">▶</button>
    </div>
    <div class="cal-grid" id="sCalGrid"></div>
    <div class="day-detail" id="sDayDetail">
      <h3 id="sDayTitle"></h3>
      <div id="sDayContent"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== STORAGE =====
const C_KEY = 'velo_sessions_v2';
const S_KEY = 'strength_workouts_v1';

function getCardio() { try { return JSON.parse(localStorage.getItem(C_KEY)||'[]'); } catch { return []; } }
function saveCardioData(a) { localStorage.setItem(C_KEY, JSON.stringify(a)); }
function getStrength() { try { return JSON.parse(localStorage.getItem(S_KEY)||'[]'); } catch { return []; } }
function saveStrengthData(a) { localStorage.setItem(S_KEY, JSON.stringify(a)); }

function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast'+(err?' error':'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ===== SECTION SWITCH =====
let currentSection = 'cardio';

function switchSection(s) {
  currentSection = s;
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.getElementById('section-'+s).classList.add('active');
  const tabs = document.querySelectorAll('.top-tab');
  tabs[0].className = 'top-tab' + (s==='cardio'?' active-cardio':'');
  tabs[1].className = 'top-tab' + (s==='strength'?' active-strength':'');
  if(s==='strength') renderStrengthHistory();
  if(s==='cardio') renderCardioHistory();
}

function switchPage(section, p) {
  const pages = document.querySelectorAll(`#section-${section} .page`);
  pages.forEach(el=>el.classList.remove('active'));
  document.getElementById(`${section}-${p}`).classList.add('active');
  const tabs = document.querySelectorAll(`#section-${section} .sub-tab`);
  tabs.forEach(t=>t.classList.remove('active'));
  const idx = ['add','history','calendar'].indexOf(p);
  if(tabs[idx]) tabs[idx].classList.add('active');
  if(p==='history' && section==='cardio') renderCardioHistory();
  if(p==='history' && section==='strength') renderStrengthHistory();
  if(p==='calendar' && section==='cardio') renderCardioCalendar();
  if(p==='calendar' && section==='strength') renderStrengthCalendar();
}

function compressImage(dataUrl, maxWidth=1024, quality=0.7) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

async function handleFile(file) {
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    document.getElementById('previewImg').src = e.target.result;
    document.getElementById('previewContainer').style.display = 'block';
    document.getElementById('loadingDiv').style.display = 'block';
    
    // Compress image before sending
    const compressedB64 = await compressImage(e.target.result);
    const b64 = compressedB64.split(',')[1];
    const mime = 'image/jpeg';
    
    try {
      const resp = await fetch('/api/scan', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({imageBase64: b64, mimeType: mime})
      });
      const parsed = await resp.json();
      console.log('AI parsed:', JSON.stringify(parsed));
      if(parsed.time_min != null && parsed.time_min !== undefined) document.getElementById('cTime').value = parsed.time_min;
      if(parsed.km != null && parsed.km !== undefined) document.getElementById('cKm').value = parsed.km;
      if(parsed.kcal != null && parsed.kcal !== undefined) document.getElementById('cCal').value = parsed.kcal;
      if(parsed.speed != null && parsed.speed !== undefined) document.getElementById('cSpeed').value = parsed.speed;
      const filled = [parsed.time_min, parsed.km, parsed.kcal, parsed.speed].filter(v => v != null).length;
      showToast(filled > 0 ? '✅ AI зчитав показники!' : '⚠️ AI не знайшов показників — введи вручну', filled === 0);
    } catch(err) {
      showToast('AI не зміг прочитати — введи вручну', true);
    } finally {
      document.getElementById('loadingDiv').style.display = 'none';
    }
  };
  reader.readAsDataURL(file);
}

function filterByPeriod(arr, period) {
  const now = new Date();
  return arr.filter(s=>{
    const d = new Date(s.date+'T12:00:00');
    if(period==='week'){
      // Calendar week Mon-Sun
      const day = now.getDay() === 0 ? 6 : now.getDay() - 1; // 0=Mon
      const weekStart = new Date(now);
      weekStart.setDate(now.getDate() - day);
      weekStart.setHours(0,0,0,0);
      return d >= weekStart;
    }
    if(period==='month'){return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();}
    return true;
  });
}

function renderCardioHistory() {
  const all = getCardio().sort((a,b)=>b.date.localeCompare(a.date));
  const sessions = filterByPeriod(all, cPeriod);
  document.getElementById('cTotalKm').textContent = sessions.reduce((s,x)=>s+x.km,0).toFixed(1);
  document.getElementById('cTotalMin').textContent = Math.round(sessions.reduce((s,x)=>s+x.time_min,0));
  document.getElementById('cTotalCal').textContent = Math.round(sessions.reduce((s,x)=>s+x.kcal,0));
  // chart removed
  const list = document.getElementById('cSessionsList');
  if(!sessions.length){list.innerHTML='<div class="empty-state"><div class="icon">🚴</div><p>Немає тренувань</p></div>';return;}
  // Group by date
  const grouped = {};
  sessions.forEach(s => {
    if (!grouped[s.date]) grouped[s.date] = [];
    grouped[s.date].push(s);
  });

  list.innerHTML = Object.keys(grouped).sort((a,b)=>b.localeCompare(a)).map(date => {
    const daySessions = grouped[date];
    const d = new Date(date+'T12:00:00');
    const totalKm = daySessions.reduce((s,x)=>s+x.km,0);
    const totalMin = daySessions.reduce((s,x)=>s+x.time_min,0);
    const totalKcal = daySessions.reduce((s,x)=>s+x.kcal,0);
    const avgSpeed = totalKm/(totalMin/60);

    const subRows = daySessions.length > 1 ? daySessions.map((s,i) => {
      const spd = s.km/(s.time_min/60);
      return `<div style="display:flex;gap:12px;padding:6px 0 0 0;border-top:1px solid var(--border);margin-top:6px;font-size:12px;color:var(--muted)">
        <span style="min-width:52px;color:var(--muted)">Заїзд ${i+1}</span>
        <span>${s.km.toFixed(1)}км</span>
        <span>${Math.round(s.time_min)}хв</span>
        ${s.kcal?`<span>${Math.round(s.kcal)}ккал`:''}
        <span>${spd.toFixed(1)}км/г</span>
        <button class="session-delete" onclick="deleteCardio(${s.id})" style="margin-left:auto">🗑</button>
      </div>`;
    }).join('') : '';

    const deleteBtn = daySessions.length === 1 ? `<button class="session-delete" onclick="deleteCardio(${daySessions[0].id})">🗑</button>` : '';

    return `<div class="session-item" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="session-date"><div class="day">${d.getDate()}</div><div class="month">${d.toLocaleString('uk-UA',{month:'short'})}</div></div>
        <div class="session-divider"></div>
        <div class="session-metrics">
          <div class="session-metric"><div class="val">${totalKm.toFixed(1)}</div><div class="key">км</div></div>
          <div class="session-metric"><div class="val">${Math.round(totalMin)}</div><div class="key">хв</div></div>
          ${totalKcal?`<div class="session-metric"><div class="val">${Math.round(totalKcal)}</div><div class="key">ккал</div></div>`:''}
          <div class="session-metric"><div class="val">${avgSpeed.toFixed(1)}</div><div class="key">км/г</div></div>
        </div>
        ${deleteBtn}
      </div>
      ${subRows}
    </div>`;
  }).join('');
}

function renderCardioChart(sessions) {
  const bars = document.getElementById('cChartBars');
  if(!sessions.length){bars.innerHTML='';return;}
  const byDate={};
  sessions.forEach(s=>{byDate[s.date]=(byDate[s.date]||0)+s.km;});
  // Only dates with actual data
  const dates=Object.keys(byDate).filter(d=>byDate[d]>0).sort().slice(-10);
  if(!dates.length){bars.innerHTML='';return;}
  const vals=dates.map(d=>byDate[d]);
  const max=Math.max(...vals)||1;
  bars.innerHTML=dates.map((d,i)=>{
    const h=Math.max(4,Math.round((vals[i]/max)*66));
    const day=new Date(d+'T12:00:00').getDate();
    const month=new Date(d+'T12:00:00').toLocaleString('uk-UA',{month:'short'});
    return `<div class="chart-bar-wrap">
      <div class="chart-bar" style="height:${h}px" title="${vals[i].toFixed(1)}км"></div>
      <div class="chart-bar-label">${day}</div>
    </div>`;
  }).join('');
}

let cCalY, cCalM;
function initCCal(){const n=new Date();cCalY=n.getFullYear();cCalM=n.getMonth();const d=getCardio().map(s=>s.date).sort().pop();if(d){cCalY=+d.slice(0,4);cCalM=+d.slice(5,7)-1;}}
function calPrev(t){if(t==='c'){cCalM--;if(cCalM<0){cCalM=11;cCalY--;}renderCardioCalendar();}else{sCalM--;if(sCalM<0){sCalM=11;sCalY--;}renderStrengthCalendar();}}
function calNext(t){if(t==='c'){cCalM++;if(cCalM>11){cCalM=0;cCalY++;}renderCardioCalendar();}else{sCalM++;if(sCalM>11){sCalM=0;sCalY++;}renderStrengthCalendar();}}

function renderCardioCalendar() {
  const byDate={};
  getCardio().forEach(s=>{byDate[s.date]=(byDate[s.date]||0)+s.km;});
  const months=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  document.getElementById('cCalTitle').textContent=`${months[cCalM]} ${cCalY}`;
  const days=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  let html=days.map(d=>`<div class="cal-header">${d}</div>`).join('');
  let start=new Date(cCalY,cCalM,1).getDay();start=start===0?6:start-1;
  for(let i=0;i<start;i++)html+='<div class="cal-day empty"></div>';
  const dim=new Date(cCalY,cCalM+1,0).getDate();
  const today=todayStr();
  for(let d=1;d<=dim;d++){
    const ds=`${cCalY}-${String(cCalM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=byDate[ds]!=null;
    const isT=ds===today;
    let cls='cal-day'+(has?' has-cardio':'')+(isT?' today':'');
    const km=has?`<div class="cal-km">${byDate[ds].toFixed(1)}км</div>`:'';
    html+=`<div class="${cls}" ${has?`onclick="showCDay('${ds}')"`:''}><div class="cal-num">${d}</div>${km}</div>`;
  }
  document.getElementById('cCalGrid').innerHTML=html;
  document.getElementById('cDayDetail').style.display='none';
}

function showCDay(ds) {
  const sessions=getCardio().filter(s=>s.date===ds);
  if(!sessions.length)return;
  const d=new Date(ds+'T12:00:00');
  document.getElementById('cDayTitle').textContent=d.toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'});
  const t=sessions.reduce((a,s)=>({km:a.km+s.km,time_min:a.time_min+s.time_min,kcal:a.kcal+s.kcal}),{km:0,time_min:0,kcal:0});
  document.getElementById('cDayMetrics').innerHTML=`
    <div class="metric-input"><label>Км</label><input readonly value="${t.km.toFixed(1)}"><span class="unit">КМ</span></div>
    <div class="metric-input"><label>Час</label><input readonly value="${Math.round(t.time_min)}"><span class="unit">ХВ</span></div>
    <div class="metric-input"><label>Ккал</label><input readonly value="${Math.round(t.kcal)}"><span class="unit">ККАЛ</span></div>`;
  const dd=document.getElementById('cDayDetail');
  dd.style.display='block';
  dd.scrollIntoView({behavior:'smooth'});
}

// ===== STRENGTH =====
let currentExercises = []; // exercises in current session being built
let editingWorkoutId = null; // id тренування, яке продовжуємо (null = нове)
let workoutStartedAt = null; // мс, коли натиснуто «Почати тренування»
let setRowCount = 1;

function setRowHTML(i, reps, weight) {
  const num = v => String(v == null ? '' : v).replace(/[^0-9.]/g, '');
  return '<div class="exercise-form" id="setRow' + i + '">'
    + '<input class="ex-input" placeholder="Повт." type="number" inputmode="numeric" min="1" id="reps' + i + '" value="' + num(reps) + '">'
    + '<input class="ex-input" placeholder="Вага кг" type="number" inputmode="decimal" step="0.5" id="weight' + i + '" value="' + num(weight) + '">'
    + '</div>';
}

function addSetRow() {
  document.getElementById('setsContainer').insertAdjacentHTML('beforeend', setRowHTML(setRowCount));
  setRowCount++;
  saveDraft();
}

function resetExerciseForm() {
  document.getElementById('exName').value = '';
  document.getElementById('setsContainer').innerHTML = setRowHTML(0);
  setRowCount = 1;
}

// Вправа, набрана у формі, але ще не додана кнопкою. null — форма порожня, false — помилка.
function readPendingExercise(strict) {
  const name = document.getElementById('exName').value.trim();
  const sets = [];
  document.querySelectorAll('#setsContainer .exercise-form').forEach(row => {
    const reps = parseInt(row.querySelector('[id^="reps"]')?.value) || 0;
    const weight = parseFloat(row.querySelector('[id^="weight"]')?.value) || 0;
    if (reps > 0) sets.push({reps, weight});
  });
  if (!name && !sets.length) return null;
  if (name.length < 2) { showToast('Введи назву вправи', true); document.getElementById('exName').focus(); return false; }
  if (!sets.length) {
    if (strict) { showToast('Додай хоч один підхід', true); return false; }
    return null;
  }
  return {name, sets};
}

function saveExercise() {
  const ex = readPendingExercise(true);
  if (ex === null) { showToast('Введи назву вправи', true); document.getElementById('exName').focus(); return; }
  if (!ex) return;
  currentExercises.push(ex);
  if (workoutStartedAt === null && editingWorkoutId === null) workoutStartedAt = Date.now();
  resetExerciseForm();
  renderCurrentWorkout();
  saveDraft();
  showToast('Вправу додано!');
}

// ── Почати / закінчити тренування
let timerTick = null;
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), p = n => String(n).padStart(2, '0');
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return (h ? h + ':' + p(m) : p(m)) + ':' + p(s % 60);
}

function renderWorkoutState() {
  const isEdit = editingWorkoutId !== null;
  const started = workoutStartedAt !== null && !isEdit;
  const timer = document.getElementById('workoutTimer');
  const startBtn = document.getElementById('startWorkoutBtn');
  const finishBtn = document.getElementById('saveWorkoutBtn');
  clearInterval(timerTick); timerTick = null;
  timer.style.display = started ? 'block' : 'none';
  startBtn.style.display = (started || isEdit) ? 'none' : 'flex';
  if (started) {
    const tick = () => { document.getElementById('timerValue').textContent = fmtDur(Date.now() - workoutStartedAt); };
    tick(); timerTick = setInterval(tick, 1000);
    document.getElementById('timerSince').textContent =
      'Почато о ' + new Date(workoutStartedAt).toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
  }
  finishBtn.style.display = (currentExercises.length || started) ? 'flex' : 'none';
  finishBtn.textContent = isEdit ? '✅ Зберегти зміни' : '🏁 Закінчити тренування';
}

function startWorkout() {
  if (editingWorkoutId !== null) return;
  workoutStartedAt = Date.now();
  const sd = document.getElementById('sDate');
  if (!sd.value) sd.value = todayStr();
  renderWorkoutState();
  saveDraft();
  showToast('Тренування почалось 💪');
}

function cancelWorkout() {
  const msg = currentExercises.length
    ? 'Скасувати тренування? Додані вправи (' + currentExercises.length + ') НЕ збережуться.'
    : 'Скасувати тренування?';
  if (!confirm(msg)) return;
  workoutStartedAt = null;
  currentExercises = [];
  resetExerciseForm();
  renderCurrentWorkout();
  saveDraft();
  showToast('Скасовано');
}

function renderCurrentWorkout() {
  const box = document.getElementById('currentWorkoutPreview');
  if (!currentExercises.length) { box.innerHTML = ''; renderWorkoutState(); return; }
  let cwTitle = 'Поточне тренування', cwCancel = '';
  if (editingWorkoutId !== null) {
    const ew = getStrength().find(x=>x.id===editingWorkoutId);
    const ed = ew ? new Date(ew.date+'T12:00:00').toLocaleDateString('uk-UA',{day:'numeric',month:'long'}) : '';
    cwTitle = 'Продовжуємо: ' + ed;
    cwCancel = '<button onclick="cancelEditing()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px">Скасувати</button>';
  }
  let html = '<div class="workout-card"><div class="workout-header"><div class="workout-title">'+cwTitle+'</div>'+cwCancel+'</div>';
  currentExercises.forEach((ex,i)=>{
    html+=`<div class="exercise-block" data-i="${i}">
      <div class="exercise-name">${ex.name}</div>
      <div class="sets-row">${ex.sets.map(s=>`<div class="set-badge">${s.reps}×${s.weight}кг</div>`).join('')}</div>
    </div>`;
  });
  html+='</div>';
  box.innerHTML = html;
  renderWorkoutState();
}

// ── Видалення затисканням: випадковий дотик нічого не видаляє
const HOLD_MS = 600;
function bindHold(container, selector, onHold) {
  let timer = null, el = null, x0 = 0, y0 = 0;
  const stop = () => { clearTimeout(timer); timer = null; if (el) el.classList.remove('holding'); el = null; };
  container.addEventListener('pointerdown', e => {
    const t = e.target.closest(selector);
    if (!t) return;
    stop();
    el = t; x0 = e.clientX; y0 = e.clientY;
    el.classList.add('holding');
    timer = setTimeout(() => { const hit = el; stop(); if (navigator.vibrate) navigator.vibrate(40); onHold(hit); }, HOLD_MS);
  });
  container.addEventListener('pointermove', e => { if (el && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) stop(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => container.addEventListener(ev, stop));
  container.addEventListener('contextmenu', e => { if (e.target.closest(selector)) e.preventDefault(); });
}

function removeSetRowEl(row) {
  const rows = document.querySelectorAll('#setsContainer .exercise-form');
  if (rows.length <= 1) row.querySelectorAll('input').forEach(i => { i.value = ''; });
  else row.remove();
  saveDraft();
  showToast('Підхід видалено');
}

function removeExercise(i) {
  const ex = currentExercises[i];
  if (!ex) return;
  currentExercises.splice(i,1);
  renderCurrentWorkout();
  saveDraft();
  showToast('Вправу «' + ex.name + '» видалено');
}

function saveWorkout() {
  // вправа, набрана у формі, але не додана кнопкою, теж іде в тренування
  const pending = readPendingExercise(false);
  if (pending === false) return;
  if (pending) { currentExercises.push(pending); resetExerciseForm(); renderCurrentWorkout(); saveDraft(); }
  if(!currentExercises.length){showToast('Додай вправи',true);return;}
  const isEdit = editingWorkoutId !== null;
  const now = Date.now();
  if (!isEdit) {
    const sets = currentExercises.reduce((a,e)=>a+e.sets.length,0);
    const dur = workoutStartedAt ? ', ' + Math.max(1, Math.round((now - workoutStartedAt)/60000)) + ' хв' : '';
    const pl = (n, one, few, many) => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
    if (!confirm('Закінчити тренування?\n' + pl(currentExercises.length, 'вправа', 'вправи', 'вправ') + ', ' + pl(sets, 'підхід', 'підходи', 'підходів') + dur)) return;
  }
  const date = document.getElementById('sDate').value||todayStr();
  const arr = getStrength();
  const target = isEdit ? arr.find(x=>x.id===editingWorkoutId) : null;
  if(target){
    target.exercises = [...currentExercises];
    target.date = date;
  } else {
    const w = { id: now, date, exercises: [...currentExercises] };
    if (workoutStartedAt) {
      w.startedAt = workoutStartedAt;
      w.endedAt = now;
      w.duration_min = Math.max(1, Math.round((now - workoutStartedAt)/60000));
    }
    arr.push(w);
  }
  saveStrengthData(arr);
  editingWorkoutId = null;
  workoutStartedAt = null;
  currentExercises=[];
  renderCurrentWorkout();
  document.getElementById('sDate').value=todayStr();
  saveDraft();
  renderStrengthHistory();
  showToast(target ? '✅ Тренування оновлено!' : '✅ Тренування завершено!');
}

  document.querySelectorAll('#strength-history .period-btn').forEach(b=>{b.classList.remove('active-p');b.classList.remove('active');});
  btn.classList.add('active-p');
  renderStrengthHistory();
}

function renderStrengthHistory() {
  const all = getStrength().sort((a,b)=>b.date.localeCompare(a.date));
  const workouts = filterByPeriod(all, sPeriod);
  let totalSets=0, totalTonnage=0;
  workouts.forEach(w=>{w.exercises.forEach(ex=>{ex.sets.forEach(s=>{totalSets++;totalTonnage+=s.reps*s.weight;});});});
  document.getElementById('sTotalWorkouts').textContent=workouts.length;
  document.getElementById('sTotalSets').textContent=totalSets;
  document.getElementById('sTotalTonnage').textContent=(totalTonnage/1000).toFixed(1);
  const list=document.getElementById('sSessionsList');
  if(!workouts.length){list.innerHTML='<div class="empty-state"><div class="icon">🏋️</div><p>Немає тренувань</p></div>';return;}
  list.innerHTML=workouts.map(w=>{
    const d=new Date(w.date+'T12:00:00');
    const exList=w.exercises.map((ex,ei)=>`
      <div class="exercise-block">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div class="exercise-name">${ex.name}</div>
          <button onclick="editExercise(${w.id},${ei})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px">✏️</button>
        </div>
        <div class="sets-row">${ex.sets.map((s,si)=>`<div class="set-badge" onclick="editSet(${w.id},${ei},${si})" style="cursor:pointer">${s.reps}×${s.weight}кг</div>`).join('')}</div>
      </div>`).join('');
    return `<div class="workout-card">
      <div class="workout-header">
        <div class="workout-title">${d.toLocaleDateString('uk-UA',{day:'numeric',month:'short'})}</div>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="workout-date">${w.exercises.length} вправ${w.duration_min ? ' · ' + w.duration_min + ' хв' : ''}</div>
          <button onclick="continueWorkout(${w.id})" style="background:var(--purple);color:#fff;border:none;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap">+ Дописати</button>
          <button class="session-delete" onclick="deleteWorkout(${w.id})">🗑</button>
        </div>
      </div>
      ${exList}
    </div>`;
  }).join('');
}

function editExercise(wid, ei) {
  const workouts = getStrength();
  const w = workouts.find(x=>x.id===wid);
  if(!w) return;
  const ex = w.exercises[ei];
  const newName = prompt('Назва вправи:', ex.name);
  if(newName && newName.trim()) {
    ex.name = newName.trim();
    saveStrengthData(workouts);
    renderStrengthHistory();
    showToast('✅ Збережено!');
  }
}

function editSet(wid, ei, si) {
  const workouts = getStrength();
  const w = workouts.find(x=>x.id===wid);
  if(!w) return;
  const set = w.exercises[ei].sets[si];
  const newReps = prompt('Повторень:', set.reps);
  if(newReps === null) return;
  const newWeight = prompt('Вага (кг):', set.weight);
  if(newWeight === null) return;
  set.reps = parseInt(newReps) || set.reps;
  set.weight = parseFloat(newWeight) || set.weight;
  saveStrengthData(workouts);
  renderStrengthHistory();
  showToast('✅ Збережено!');
}

function continueWorkout(id){
  const w = getStrength().find(x=>x.id===id);
  if(!w){showToast('Тренування не знайдено',true);return;}
  if((currentExercises.length || workoutStartedAt!==null) && editingWorkoutId!==id){
    if(!confirm('Незбережене поточне тренування буде замінено. Продовжити?')) return;
  }
  editingWorkoutId = id;
  workoutStartedAt = null;
  currentExercises = JSON.parse(JSON.stringify(w.exercises||[]));
  const sd = document.getElementById('sDate');
  if(sd) sd.value = w.date;
  renderCurrentWorkout();
  switchPage('strength','add');
  saveDraft();
  showToast('Дописуй вправи');
}

function cancelEditing(){
  editingWorkoutId = null;
  currentExercises = [];
  const sd = document.getElementById('sDate');
  if(sd) sd.value = todayStr();
  renderCurrentWorkout();
  saveDraft();
  showToast('Скасовано');
}

function deleteWorkout(id){
  if(!confirm('Видалити тренування?'))return;
  saveStrengthData(getStrength().filter(w=>w.id!==id));
  renderStrengthHistory();
  showToast('Видалено');
}

// Strength Calendar
let sCalY, sCalM;
function initSCal(){const n=new Date();sCalY=n.getFullYear();sCalM=n.getMonth();const d=getStrength().map(s=>s.date).sort().pop();if(d){sCalY=+d.slice(0,4);sCalM=+d.slice(5,7)-1;}}

function renderStrengthCalendar(){
  const byDate={};
  getStrength().forEach(w=>{byDate[w.date]=(byDate[w.date]||0)+1;});
  const months=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  document.getElementById('sCalTitle').textContent=`${months[sCalM]} ${sCalY}`;
  const days=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  let html=days.map(d=>`<div class="cal-header">${d}</div>`).join('');
  let start=new Date(sCalY,sCalM,1).getDay();start=start===0?6:start-1;
  for(let i=0;i<start;i++)html+='<div class="cal-day empty"></div>';
  const dim=new Date(sCalY,sCalM+1,0).getDate();
  const today=todayStr();
  for(let d=1;d<=dim;d++){
    const ds=`${sCalY}-${String(sCalM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=byDate[ds];
    const isT=ds===today;
    let cls='cal-day'+(has?' has-strength':'')+(isT?' today':'');
    const dot=has?`<div class="cal-dots"><div class="cal-dot s"></div></div>`:'';
    html+=`<div class="${cls}" ${has?`onclick="showSDay('${ds}')"`:''}><div class="cal-num">${d}</div>${dot}</div>`;
  }
  document.getElementById('sCalGrid').innerHTML=html;
  document.getElementById('sDayDetail').style.display='none';
}

function showSDay(ds){
  const workouts=getStrength().filter(w=>w.date===ds);
  if(!workouts.length)return;
  const d=new Date(ds+'T12:00:00');
  document.getElementById('sDayTitle').textContent=d.toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'});
  let html='';
  workouts.forEach(w=>{
    w.exercises.forEach(ex=>{
      html+=`<div class="exercise-block">
        <div class="exercise-name">${ex.name}</div>
        <div class="sets-row">${ex.sets.map(s=>`<div class="set-badge">${s.reps}×${s.weight}кг</div>`).join('')}</div>
      </div>`;
    });
  });
  document.getElementById('sDayContent').innerHTML=html;
  const dd=document.getElementById('sDayDetail');
  dd.style.display='block';
  dd.scrollIntoView({behavior:'smooth'});
}


// ===== ЧЕРНЕТКА: автозбереження незавершеного вводу =====
const D_KEY = 'velo_draft_v1';
const dv = id => { const e = document.getElementById(id); return e ? e.value : ''; };
const dset = (id, v) => { const e = document.getElementById(id); if (e && v != null) e.value = v; };
const C_FIELDS = ['cDate','cTime','cKm','cCal','cSpeed','cWatt','cLevel'];

function readSetRows() {
  return [...document.querySelectorAll('#setsContainer .exercise-form')].map(r => ({
    reps: r.querySelector('[id^="reps"]')?.value || '',
    weight: r.querySelector('[id^="weight"]')?.value || ''
  }));
}

function renderSetRows(rows) {
  const c = document.getElementById('setsContainer');
  if (!c) return;
  if (!rows || !rows.length) rows = [{reps:'', weight:''}];
  c.innerHTML = rows.map((r, i) => setRowHTML(i, r.reps, r.weight)).join('');
  setRowCount = rows.length;
}

function saveDraft() {
  try {
    localStorage.setItem(D_KEY, JSON.stringify({
      exercises: currentExercises,
      editingWorkoutId,
      workoutStartedAt,
      exName: dv('exName'),
      sDate: dv('sDate'),
      rows: readSetRows(),
      cardio: C_FIELDS.reduce((o, id) => (o[id] = dv(id), o), {})
    }));
  } catch (e) {}
}

function restoreDraft() {
  let d;
  try { d = JSON.parse(localStorage.getItem(D_KEY) || '{}'); } catch { return; }
  if (!d || typeof d !== 'object') return;
  if (d.editingWorkoutId != null) editingWorkoutId = d.editingWorkoutId;
  if (d.workoutStartedAt) workoutStartedAt = d.workoutStartedAt;
  if (Array.isArray(d.exercises) && d.exercises.length) {
    currentExercises = d.exercises;
    renderCurrentWorkout();
  }
  dset('exName', d.exName);
  if (d.sDate) dset('sDate', d.sDate);
  if (Array.isArray(d.rows) && d.rows.some(r => r.reps || r.weight)) renderSetRows(d.rows);
  if (d.cardio) C_FIELDS.forEach(id => { if (d.cardio[id]) dset(id, d.cardio[id]); });
}

let draftTimer = null;
function queueDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 400); }
document.addEventListener('input', queueDraft);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraft(); });
window.addEventListener('pagehide', saveDraft);
window.addEventListener('blur', saveDraft);

// ===== ЧИСТИЙ ЛИСТ з 2026-09-19 =====
// Одноразово: прибрати все, що раніше 19.09.2026 (кардіо й силові).
// Тренування від цієї дати лишаються. Прапорець не дає запускатись удруге,
// тож пізніше додані записи за будь-яку дату не чіпаються.
(function(){
  const FLAG = 'velo_reset_2026_09_19';
  const FROM = '2026-09-19';
  try {
    if (localStorage.getItem(FLAG)) return;
    saveCardioData(getCardio().filter(s => s.date >= FROM));
    const kept = getStrength().filter(w => w.date >= FROM);
    saveStrengthData(kept);
    const d = JSON.parse(localStorage.getItem(D_KEY) || '{}');
    if (d && d.editingWorkoutId != null && !kept.some(w => w.id === d.editingWorkoutId)) {
      localStorage.removeItem(D_KEY);
    }
    localStorage.setItem(FLAG, String(Date.now()));
  } catch (e) {}
})();

initCCal();
initSCal();
restoreDraft();
renderCurrentWorkout();
bindHold(document.getElementById('setsContainer'), '.exercise-form', removeSetRowEl);
bindHold(document.getElementById('currentWorkoutPreview'), '.exercise-block', el => removeExercise(+el.dataset.i));
</script>
